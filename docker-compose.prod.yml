services:
  mongodb:
    image: mongo:8.0
    container_name: taskflow-mongodb-prod
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-taskflow}
    volumes:
      - mongo-data-prod:/data/db
    networks:
      - taskflow-network-prod
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/${MONGO_DB_NAME:-taskflow}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    command: ["npm", "start"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-network-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: taskflow-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - taskflow-network-prod

volumes:
  mongo-data-prod:
    name: taskflow-mongo-data-prod

networks:
  taskflow-network-prod:
    name: taskflow-network-prod
    driver: bridge
